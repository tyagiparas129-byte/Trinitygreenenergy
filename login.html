<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TrinityGreen Energy</title>
</head>

<body>

    <h1>TrinityGreen Energy</h1>
    <h2>Customer Login</h2>

    <form id="loginForm">

        <label>Email:</label><br>
        <input type="email" id="email" placeholder="Enter your email" required>
        <br><br>

        <label>Password:</label><br>
        <input type="password" id="password" placeholder="Enter your password" required>
        <br><br>

        <button type="submit">Login</button>

    </form>

    <p>New customer?</p>
    <a href="signup.html">Create Account</a>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";


        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "trinity-green-energy.firebaseapp.com",
            projectId: "trinity-green-energy",
            storageBucket: "trinity-green-energy.firebasestorage.app",
            messagingSenderId: "186084209724",
            appId: "1:186084209724:web:4a187b8e51417b21d27f39"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);


        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;


            signInWithEmailAndPassword(auth, email, password)

                .then((userCredential) => {

                    alert("Login successful!");

                    window.location.href = "dashboard.html";

                })

                .catch((error) => {

                    alert(error.message);

                });

        });

    </script>

</body>

</html>
