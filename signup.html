<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TrinityGreen Energy</title>
</head>

<body>

    <h1>TrinityGreen Energy</h1>
    <h2>Create Customer Account</h2>

    <form>
        <label>Full Name:</label><br>
        <input type="text" placeholder="Enter your full name" required><br><br>

        <label>Mobile Number:</label><br>
        <input type="tel" placeholder="Enter your mobile number" required><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter your email" required><br><br>

        <label>Password:</label><br>
        <input type="password" placeholder="Create a password" required><br><br>

        <label>Address:</label><br>
        <textarea placeholder="Enter your address" required></textarea><br><br>

        <button type="submit">Create Account</button>
    </form>

    <p>Already have an account?</p>
    <a href="login.html">Login</a>

</body>
</html>
