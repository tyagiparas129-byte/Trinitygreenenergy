<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TrinityGreen Energy</title>
</head>

<body>

    <h1>TrinityGreen Energy</h1>
    <h2>Create Customer Account</h2>

    <form id="signupForm">

        <label>Full Name:</label><br>
        <input type="text" id="name" placeholder="Enter your full name" required>
        <br><br>

        <label>Mobile Number:</label><br>
        <input type="tel" id="mobile" placeholder="Enter your mobile number" required>
        <br><br>

        <label>Email:</label><br>
        <input type="email" id="email" placeholder="Enter your email" required>
        <br><br>

        <label>Password:</label><br>
        <input type="password" id="password" placeholder="Create a password" required>
        <br><br>

        <label>Address:</label><br>
        <textarea id="address" placeholder="Enter your address" required></textarea>
        <br><br>

        <button type="submit">Create Account</button>

    </form>

    <p>Already have an account?</p>
    <a href="login.html">Login</a>


    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";


        const firebaseConfig = {

            apiKey: "AIzaSyD5827waZLxQ72mJvcPKuGXeppdLES1QxA",
            authDomain: "trinity-green-energy.firebaseapp.com",
            projectId: "trinity-green-energy",
            storageBucket: "trinity-green-energy.firebasestorage.app",
            messagingSenderId: "186084209724",
            appId: "1:186084209724:web:4a187b8e51417b21d27f39"

        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        document.getElementById("signupForm").addEventListener("submit", async function(event) {

            event.preventDefault();


            const name = document.getElementById("name").value;

            const mobile = document.getElementById("mobile").value;

            const email = document.getElementById("email").value;

            const password = document.getElementById("password").value;

            const address = document.getElementById("address").value;


            try {

                const userCredential =
                    await createUserWithEmailAndPassword(auth, email, password);


                const user = userCredential.user;


                await setDoc(doc(db, "users", user.uid), {

                    name: name,

                    mobile: mobile,

                    email: email,

                    address: address

                });


                alert("Account created successfully!");

                window.location.href = "dashboard.html";


            } catch (error) {

                alert(error.message);

            }

        });

    </script>

</body>

</html>
