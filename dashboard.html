<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TrinityGreen Energy</title>
</head>

<body>

    <h1>TrinityGreen Energy</h1>
    <h2>Welcome 👋</h2>

    <h3>Customer Information</h3>

    <p><strong>Name:</strong> <span id="name">Loading...</span></p>
    <p><strong>Mobile:</strong> <span id="mobile">Loading...</span></p>
    <p><strong>Email:</strong> <span id="email">Loading...</span></p>
    <p><strong>Address:</strong> <span id="address">Loading...</span></p>

    <hr>

    <h3>Your Solar System</h3>
    <p><strong>System Size:</strong> 5 kW</p>

    <h3>Today's Generation</h3>
    <p>18.4 kWh</p>

    <h3>This Month</h3>
    <p>524 kWh</p>

    <h3>Estimated Savings</h3>
    <p>₹4,800</p>

    <h3>System Status</h3>
    <p>🟢 Online</p>

    <br>

    <button id="logoutBtn">Logout</button>


    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";


        const firebaseConfig = {

            apiKey: "AIzaSyD5827waZLxQ72mJvcPKuGXeppdLES1QxA",
            authDomain: "trinity-green-energy.firebaseapp.com",
            projectId: "trinity-green-energy",
            storageBucket: "trinity-green-energy.firebasestorage.app",
            messagingSenderId: "186084209724",
            appId: "1:186084209724:web:4a187b8e51417b21d27f39"

        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        onAuthStateChanged(auth, async (user) => {

            if (!user) {

                window.location.href = "login.html";

                return;

            }


            const userRef = doc(db, "users", user.uid);

            const userSnap = await getDoc(userRef);


            if (userSnap.exists()) {

                const data = userSnap.data();

                document.getElementById("name").textContent = data.name;
                document.getElementById("mobile").textContent = data.mobile;
                document.getElementById("email").textContent = data.email;
                document.getElementById("address").textContent = data.address;

            }

        });


        document.getElementById("logoutBtn").addEventListener("click", () => {

            signOut(auth).then(() => {

                window.location.href = "login.html";

            });

        });

    </script>

</body>

</html>
